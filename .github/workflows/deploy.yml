name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Validate static data
        run: npm run data:validate
      - name: Test data safety gates
        run: npm run data:test
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed latest data
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER || 'demo' }}
        run: |
          if [ "$DATA_PROVIDER" = "live" ]; then
            python3 scripts/smoke_deployment.py --base-url "$PAGE_URL" --require-live
          else
            python3 scripts/smoke_deployment.py --base-url "$PAGE_URL"
          fi
