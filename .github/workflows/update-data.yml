name: Update TACO market data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch and validate market data
        env:
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER || 'demo' }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MARKET_API_KEY: ${{ secrets.MARKET_API_KEY }}
        run: npm run data:update
      - name: Validate generated JSON
        run: npm run data:validate
      - name: Commit changed data only
        run: |
          if git diff --quiet -- public/data/latest.json public/data/history.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/history.json
          git commit -m "chore(data): update TACO market data"
          git push
