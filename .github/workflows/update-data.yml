name: Update TACO market data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: Data provider
        required: true
        type: choice
        default: live
        options:
          - demo
          - live
      publish:
        description: Publish validated JSON
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.event_name != 'schedule' || vars.DATA_PROVIDER == 'live' }}
    runs-on: ubuntu-latest
    env:
      DATA_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || vars.DATA_PROVIDER || 'demo' }}
      PUBLISH_DATA: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch and validate market data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run data:update
      - name: Validate generated JSON
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [ "$DATA_PROVIDER" = "live" ]; then
            npm run data:validate -- --require-live
          else
            npm run data:validate
          fi
      - name: Commit changed data only
        id: commit-data
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if git diff --quiet -- public/data/latest.json public/data/history.json; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/history.json
          git commit -m "chore(data): update TACO market data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger Pages deployment
        if: ${{ steps.commit-data.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
